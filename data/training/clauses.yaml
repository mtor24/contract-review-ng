# Training data for the OPTIONAL TF-IDF clause classifier (core/tfidf.py).
#
# WHAT THIS FILE IS
# When the rule-based classifier labels a clause "other", an optional
# statistical model (TF-IDF + logistic regression) may suggest a label
# instead. This file is its entire training set. Every example below is
# SYNTHETIC: written for this project, not copied from any real client
# contract. The model is trained in memory at first use; nothing is
# saved to disk.
#
# HOW LAWYERS CAN IMPROVE THE FALLBACK
# The more realistic examples each label has, the better the suggestions.
# To add examples, copy the "- label: ... / text: ..." format below:
#   - label must be one of the 19 label ids in rules/clause_patterns.yaml.
#   - text should be one or two short sentences written the way such a
#     clause actually appears in a Nigerian contract.
#   - Use plain ASCII only (no fancy quotes, no Naira sign).
#   - Never paste real client text here; keep examples generic.
# A paragraph of varied wording helps more than near-duplicates of the
# same sentence.

