# Clause classification rules - EDITABLE BY NON-PROGRAMMERS
#
# HOW THIS FILE WORKS
# Each entry under "labels" describes one kind of contract clause. The
# classifier gives every clause a score for every label and picks the
# label with the highest score. A clause that scores zero everywhere is
# labelled "other".
#
# HOW TO EDIT
# - heading_keywords: lower-case words or short phrases that typically
#   appear in the clause HEADING (the title line, e.g. "GOVERNING LAW").
#   Heading matches are worth heading_weight points each (see bottom).
# - phrases: lower-case phrases looked up in the full clause TEXT. Each
#   distinct matched phrase is worth phrase_weight points.
# - Keep everything lower-case; matching is case-insensitive but the
#   file must stay lower-case for consistency.
# - Use plain ASCII only (no fancy quotes or dashes). The Naira sign is
#   fine in contract text but keep it out of this file.
# - Add a brand-new label by copying an existing block and giving it a
#   new unique id (snake_case). The order of labels matters: ties are
#   broken in favour of the label listed first here.
# - heading_weight and phrase_weight at the bottom tune how much a
#   heading match counts versus a text-phrase match.
# - only_for: optional list of contract type ids (employment, supply,
#   lease, nda, partnership, sla, loan). If set, the label only applies
#   to those contract types; for any other contract type it scores 0.
#   When no contract type is given, every label is allowed.

